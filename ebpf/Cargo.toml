[package]
name = "kala-ebpf-kernel"
version = "0.1.0"
edition = "2024"
publish = false
description = "Kernel-side eBPF uprobe that timestamps Surface::queueBuffer on Android"
license = "MIT"

[[bin]]
name = "kala-ebpf-kernel"
path = "src/main.rs"

[dependencies]
aya-ebpf = "0.1.1"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

# Standalone workspace so the outer kala workspace doesn't try to
# resolve aya-ebpf against the host target. Building this crate is the
# job of `kala`'s build.rs.
[workspace]
