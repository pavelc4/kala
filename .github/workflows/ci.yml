name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-linux:
    name: check · linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A fresh checkout has no `assets/kala-ebpf.bpf.o` (not in git),
      # so build.rs would trigger its auto-rebuild inside the *host*
      # cargo run — where the host stable rustc can shadow the pinned
      # nightly via PATH. Build the object out-of-band instead: inside
      # the ebpf crate dir (NOT the workspace root), with the nightly
      # cargo/rustc resolved explicitly and build-std on the command
      # line. Dropping the asset in place makes build.rs a no-op for
      # every later step.
      - name: Install eBPF build toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup component add rust-src --toolchain nightly
          mkdir -p "$HOME/.local/bin"
          curl -fLO https://github.com/aya-rs/bpf-linker/releases/latest/download/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          tar -xpf bpf-linker-x86_64-unknown-linux-musl.tar.zst -C "$HOME/.local/bin"
          rm -f bpf-linker-x86_64-unknown-linux-musl.tar.zst
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build embedded eBPF object
        run: |
          cd ebpf
          RUSTC="$(rustup which rustc --toolchain nightly)" \
            "$(rustup which cargo --toolchain nightly)" build \
            -Zbuild-std=core --target-dir ../ebpf-target
          mkdir -p ../kala/assets
          cp ../ebpf-target/bpfel-unknown-none/debug/kala-ebpf-kernel ../kala/assets/kala-ebpf.bpf.o
          echo "--- eBPF asset:"
          sha256sum ../kala/assets/kala-ebpf.bpf.o
      - run: cargo clippy -p kala-ebpf --all-targets -- -D warnings -W clippy::pedantic
      - run: cargo test -p kala-ebpf
      # Packaging sanity: asset + docs + ready for crates.io upload.
      - run: cargo publish -p kala-ebpf --dry-run --allow-dirty
      # Hand the freshly regenerated asset to the Android job (and any
      # cross job) so it never needs the eBPF toolchain itself.
      - name: Upload regenerated BPF asset
        uses: actions/upload-artifact@v7
        with:
          name: ebpf-asset
          path: kala/assets/kala-ebpf.bpf.o

  build-android:
    name: build · android
    needs: check-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - uses: Swatinem/rust-cache@v2
      - name: Download prebuilt BPF asset
        uses: actions/download-artifact@v8
        with:
          name: ebpf-asset
          path: kala/assets
      - name: cargo build (aarch64-linux-android)
        run: cargo build -p kala-ebpf --example basic --release --target aarch64-linux-android
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang
