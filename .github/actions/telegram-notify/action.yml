name: Telegram Notify
description: Send notification to Telegram (message only)

inputs:
  bot_token:
    description: Telegram Bot Token
    required: false
    default: ""
  chat_id:
    description: Telegram Chat ID
    required: false
    default: ""
  type:
    description: Notification type (start, complete, failure)
    required: true
    default: complete
  caption:
    description: Custom caption override (optional)
    required: false
    default: ""
  delete_message_id:
    description: Message ID to delete after sending (optional)
    required: false
    default: ""

outputs:
  message_id:
    description: Sent message ID (for later deletion)
    value: ${{ steps.send.outputs.message_id }}

runs:
  using: composite
  steps:
    - name: Send Notification
      id: send
      shell: bash
      env:
        BOT_TOKEN: ${{ inputs.bot_token }}
        CHAT_ID: ${{ inputs.chat_id }}
        NOTIFY_TYPE: ${{ inputs.type }}
        CUSTOM_CAPTION: ${{ inputs.caption }}
        DELETE_MSG_ID: ${{ inputs.delete_message_id }}
        RUN_NUMBER: ${{ github.run_number }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
          echo "Telegram credentials not provided, skipping notification"
          exit 0
        fi

        COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "CI Build")
        # Escape HTML characters to prevent Telegram parse_mode=HTML errors
        SAFE_COMMIT_MSG=$(echo "$COMMIT_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

        if [ "$NOTIFY_TYPE" = "start" ]; then
          MESSAGE=$(printf "<b>Kala</b> #ci_%s\n\n<b>BUILDING</b>\n\n<blockquote><code>%s</code></blockquote>\n\n<a href=\"%s\">Commit</a> • <a href=\"%s\">Workflow</a>" "$RUN_NUMBER" "$SAFE_COMMIT_MSG" "$COMMIT_URL" "$WORKFLOW_URL")
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode "text=$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true")
          echo "Telegram Response: $RESPONSE"
          MESSAGE_ID=$(echo "$RESPONSE" | grep -o '"message_id":[0-9]*' | cut -d: -f2 || true)
          if [ -n "$MESSAGE_ID" ]; then
            echo "message_id=$MESSAGE_ID" >> $GITHUB_OUTPUT
          fi

        elif [ "$NOTIFY_TYPE" = "complete" ]; then
          if [ -n "$CUSTOM_CAPTION" ]; then
            MESSAGE="$CUSTOM_CAPTION"
          else
            MESSAGE=$(printf "<b>Kala</b> #ci_%s\n\n<b>PASSED</b>\n\n<blockquote><code>%s</code></blockquote>\n\n<a href=\"%s\">Commit</a> • <a href=\"%s\">Workflow</a>" "$RUN_NUMBER" "$SAFE_COMMIT_MSG" "$COMMIT_URL" "$WORKFLOW_URL")
          fi
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode "text=$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true")
          echo "Telegram Response: $RESPONSE"

        elif [ "$NOTIFY_TYPE" = "failure" ]; then
          MESSAGE=$(printf "<b>Kala</b> #ci_%s\n\n<b>FAILED</b>\n\n<blockquote><code>%s</code></blockquote>\n\n<a href=\"%s\">Commit</a> • <a href=\"%s\">Workflow</a>" "$RUN_NUMBER" "$SAFE_COMMIT_MSG" "$COMMIT_URL" "$WORKFLOW_URL")
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode "text=$MESSAGE" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true")
          echo "Telegram Response: $RESPONSE"
        fi

        # Delete start message if provided
        if [ -n "$DELETE_MSG_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/deleteMessage" \
            -d chat_id="$CHAT_ID" \
            -d message_id="$DELETE_MSG_ID" || true
        fi
