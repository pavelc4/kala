[package]
name = "kala-ebpf"
version = "0.1.0"
description = "Per-app frame-time probe for Android via eBPF uprobe on libgui Surface::queueBuffer"
keywords = ["ebpf", "android", "frame-time", "uprobe", "aya"]
categories = ["os::linux-apis", "external-ffi-bindings"]
readme = "../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# The pre-built BPF object (`assets/kala-ebpf.bpf.o`) ships inside the
# package, so consumers get a working `cargo add kala-ebpf` with no
# bpf-linker / nightly. Maintainers regenerate it with
# `KALA_REBUILD_BPF=1 cargo build` (requires bpf-linker + nightly).
build = "build.rs"
include = [
    "src/**/*",
    "build.rs",
    "examples/**/*",
    "assets/*.bpf.o",
]

[dependencies]
aya = "0.13.1"
libc = "0.2.191"
mio = { version = "1.2.4", features = ["os-ext"] }
thiserror = "2.0.21"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "fps_monitor"
path = "examples/fps_monitor.rs"

[[example]]
name = "multi_target"
path = "examples/multi_target.rs"

[[example]]
name = "jank_detector"
path = "examples/jank_detector.rs"
